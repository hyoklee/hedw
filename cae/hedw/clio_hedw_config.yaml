# CLIO runtime config for the HEDW-US CAE CSV assimilation runs (single node, RAM tier).
memory:
  main_segment_size: auto
  client_data_segment_size: 2GB
  runtime_data_segment_size: 2GB
networking:
  port: 10700
  neighborhood_size: 1
logging:
  level: info
  file: /tmp/clio_hedw.log
runtime:
  num_threads: 4
  queue_depth: 1024
  local_sched: "default"
  heartbeat_interval: 1000
compose:
  - mod_name: clio_cte_core
    pool_name: cte_main
    pool_query: local
    pool_id: "512.0"
    targets:
      neighborhood: 1
      default_target_timeout_ms: 30000
      poll_period_ms: 5000
    storage:
      - path: "ram::cte_ram_tier1"
        bdev_type: "ram"
        capacity_limit: "2GB"
        score: 0.0
    dpe:
      dpe_type: "max_bw"
  - mod_name: clio_cae_core
    pool_name: cae_main
    pool_query: local
    pool_id: "400.0"
